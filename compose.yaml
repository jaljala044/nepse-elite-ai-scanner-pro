services:
  nepse-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nepse-elite-ai-scanner-pro:local
    init: true
    restart: unless-stopped
    environment:
      NEPSE_API_DATABASE: /var/lib/nepse/nepse-api.duckdb
      NEPSE_PORTFOLIO_DB: /var/lib/nepse/portfolios.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - nepse-data:/var/lib/nepse
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Deliberately one container/one Uvicorn worker. Do not scale horizontally
    # or attach a second writer to this DuckDB file.

volumes:
  nepse-data:
    name: nepse-api-data
