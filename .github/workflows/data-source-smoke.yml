name: data-source-smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/app/hf_dataset_collector.py"
      - "backend/app/normalize_floorsheet.py"
      - "backend/collect_hf_datasets.py"
      - "backend/normalize_floorsheet_csv.py"
      - "backend/probe_hf_dataset.py"
      - "backend/audit_silver_floorsheet.py"
      - "backend/app/normalize_indices.py"
      - "backend/normalize_indices_csv.py"
      - "backend/audit_silver_indices.py"
      - ".github/workflows/data-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-floorsheet-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Install shared validation package
        run: python -m pip install "git+https://github.com/jaljala044/nepse-smc-data.git@122acaae8665fd396d206ea40b66861b9cbd4d6b"
      - name: Probe Hugging Face dataset tree response
        run: python probe_hf_dataset.py
        working-directory: backend
      - name: Download one known trading session
        run: >
          python collect_hf_datasets.py
          --dataset floorsheet_indices_2024
          --download
          --from-date 2024-01-02
          --to-date 2024-01-02
          --max-total-mb 50
          --max-file-mb 50
          --max-files 5
        working-directory: backend
      - name: Resolve downloaded paths from immutable acquisition manifest
        id: sample-paths
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          from pathlib import Path

          manifests = sorted(glob.glob("data/raw/huggingface/manifests/hf_inventory_*.json"))
          if not manifests:
              raise SystemExit("Collector did not write an acquisition manifest")
          manifest = json.loads(Path(manifests[-1]).read_text(encoding="utf-8"))
          dataset = manifest.get("datasets", {}).get("floorsheet_indices_2024", {})
          records = dataset.get("records", [])
          good = [r for r in records if r.get("status") in {"downloaded", "already_present"} and r.get("local_path")]
          floorsheet = [r["local_path"] for r in good if r.get("path", "").startswith("floorsheet/")]
          indices = [r["local_path"] for r in good if r.get("path", "").startswith("indices/")]
          if not floorsheet or not indices:
              raise SystemExit(f"Manifest lacks downloaded sample paths: floorsheet={len(floorsheet)}, indices={len(indices)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"floorsheet_dir={Path(floorsheet[0]).parent.as_posix()}\n")
              out.write(f"indices_dir={Path(indices[0]).parent.as_posix()}\n")
          print(f"Resolved pinned commit {dataset.get('revision')} with {len(floorsheet)} floorsheet and {len(indices)} index file(s)")
          PY
      - name: Normalize sample floorsheet
        run: >
          python normalize_floorsheet_csv.py
          "${{ steps.sample-paths.outputs.floorsheet_dir }}"
          --source urekmazino69/Nepse-floorsheet-and-indices
          --max-reject-ratio 0.10
        working-directory: backend
      - name: Normalize sample sector indices
        run: >
          python normalize_indices_csv.py
          "${{ steps.sample-paths.outputs.indices_dir }}"
          --source urekmazino69/Nepse-floorsheet-and-indices
          --max-reject-ratio 0.10
        working-directory: backend
      - name: Audit normalized floorsheet
        run: python audit_silver_floorsheet.py --output ../data/reports/sample-floorsheet-audit.json
        working-directory: backend
      - name: Audit normalized sector indices
        run: python audit_silver_indices.py --output ../data/reports/sample-sector-index-audit.json
        working-directory: backend
      - name: Upload raw sample, normalized rows and audit
        uses: actions/upload-artifact@v4
        with:
          name: nepse-floorsheet-sample-2024-01-02
          path: |
            data/raw/huggingface/
            data/silver/floorsheet/
            data/quarantine/
            data/reports/
          if-no-files-found: error
          retention-days: 14
