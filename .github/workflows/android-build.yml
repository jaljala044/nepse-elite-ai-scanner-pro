name: Android debug build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon >"$log" 2>&1; then
              cat "$log"; rm "$log"; exit 0
            fi
            cat "$log"
            if ! grep -Eq 'status code 429|Too Many Requests' "$log" || [ "$attempt" -eq 3 ]; then
              rm "$log"; exit 1
            fi
            rm "$log"
            sleep "$((attempt * 30))"
          done
      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk/debug
          test -s app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          "$sdk_root/build-tools/35.0.0/apksigner" verify --verbose app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nepse-scanner-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
