name: Historical identity regression

on:
  push:
    paths:
      - "backend/tests/test_historical_identity_regression.py"
      - "backend/app/instrument_manifest.py"
      - "backend/tests/test_instrument_manifest.py"
      - "data/reference/nepse_security_id_snapshot_2026-11-25.csv"
      - "data/reference/nepse_historical_identity_evidence_2026-11-26.json"
      - ".github/workflows/historical-identity-regression.yml"
  pull_request:
    paths:
      - "backend/tests/test_historical_identity_regression.py"
      - "backend/app/instrument_manifest.py"
      - "backend/tests/test_instrument_manifest.py"
      - "data/reference/nepse_security_id_snapshot_2026-11-25.csv"
      - "data/reference/nepse_historical_identity_evidence_2026-11-26.json"
      - ".github/workflows/historical-identity-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-identity-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run historical identity regression tests
        run: |
          python -m unittest discover -s tests -p "test_historical_identity_regression.py" -v
          python -m unittest discover -s tests -p "test_instrument_manifest.py" -v
        working-directory: backend
