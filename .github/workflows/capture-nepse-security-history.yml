name: Capture official NEPSE per-security history

on:
  push:
    branches: [main]
    paths:
      - "backend/capture_nepse_security_history.py"
      - "backend/tests/test_nepse_security_history_capture.py"
      - ".github/workflows/capture-nepse-security-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nepse-official-security-history-2026-11-19-24
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned NEPSE client
        run: python -m pip install --disable-pip-version-check "nepse-client==0.1.4"
      - name: Test per-security history parser and fail-closed states
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_nepse_security_history_capture.py' -v
      - name: Capture official per-security history for crosswalk universe
        run: |
          set -euo pipefail
          python backend/capture_nepse_security_history.py \
            --crosswalk data/reference/nepse_equity_security_id_crosswalk_2026-11-26.csv \
            --output-dir evidence/nepse-security-history/2026-11-19_to_2026-11-24 \
            --start-date 2026-11-19 \
            --end-date 2026-11-24 \
            --pause-seconds 0.15
      - name: Commit raw official per-security responses
        run: |
          set -euo pipefail
          source_dir="evidence/nepse-security-history/2026-11-19_to_2026-11-24"
          target="data/evidence/raw/nepse/security-history/2026-11-19_to_2026-11-24"
          mkdir -p "$target"
          cp -R "$source_dir/." "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "data: archive official NEPSE per-security history sample"
            git pull --rebase origin main
            git push
          else
            echo "No new official per-security history bytes to commit."
          fi
      - name: Upload capture artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-official-security-history-${{ github.run_id }}
          path: evidence/nepse-security-history/
          if-no-files-found: warn
          retention-days: 90
