name: Capture primary reference evidence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-primary-reference-evidence.yml"

permissions:
  contents: write

concurrency:
  group: primary-reference-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Capture official CDSC clearing-member CSV
        shell: bash
        run: |
          mkdir -p evidence/cdsc evidence/nepse
          url="https://cdsc.com.np/export-clearing-member-csv"
          if curl --fail --location --retry 3 --retry-all-errors --max-time 90 \
            --dump-header evidence/cdsc/response-headers.txt \
            --output evidence/cdsc/clearing-members.csv "$url"; then
            printf '%s\n' "$url" > evidence/cdsc/source-url.txt
            sha256sum evidence/cdsc/clearing-members.csv > evidence/cdsc/SHA256SUMS
            python - <<'PY'
          import csv, json, hashlib, email.utils
          from pathlib import Path
          p = Path("evidence/cdsc/clearing-members.csv")
          with p.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              columns = reader.fieldnames or []
          cm_column = next((c for c in columns if "cm" in c.lower() and ("no" in c.lower() or "number" in c.lower())), None)
          headers = Path("evidence/cdsc/response-headers.txt").read_text()
          date_header = next((line.split(":", 1)[1].strip() for line in headers.splitlines() if line.lower().startswith("date:")), None)
          retrieved = email.utils.parsedate_to_datetime(date_header).isoformat() if date_header else None
          report = {
              "source_url": "https://cdsc.com.np/export-clearing-member-csv",
              "retrieved_at": retrieved,
              "http_status": 200,
              "content_type": "text/csv;charset=UTF-8",
              "source_payload_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              "byte_count": p.stat().st_size,
              "row_count": len(rows),
              "columns": columns,
              "cm_number_column": cm_column,
              "cm_numbers": sorted({str(r.get(cm_column, "")).strip() for r in rows if cm_column and str(r.get(cm_column, "")).strip()}, key=lambda x: int(x) if x.isdigit() else x),
              "raw_bytes_preserved": True,
              "historical_effective_date_coverage": False,
              "canonical_identity_promotion_allowed": False
          }
          Path("evidence/cdsc/capture-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
          else
            printf 'capture_failed\n' > evidence/cdsc/CAPTURE_FAILED.txt
          fi
      - name: Capture official NEPSE holiday listing response
        shell: bash
        run: |
          urls=("https://www.nepalstock.com/holiday-listing" "https://nepalstock.com/holiday-listing")
          captured=0
          for url in "${urls[@]}"; do
            if curl --http1.1 --location --retry 3 --retry-all-errors --max-time 90 \
              --dump-header evidence/nepse/holiday-response-headers.txt \
              --output evidence/nepse/holiday-listing.html "$url"; then
              printf '%s\n' "$url" > evidence/nepse/source-url.txt
              sha256sum evidence/nepse/holiday-listing.html > evidence/nepse/SHA256SUMS
              wc -c evidence/nepse/holiday-listing.html > evidence/nepse/byte-count.txt
              captured=1
              break
            fi
          done
          if [ "$captured" -eq 0 ]; then
            printf 'capture_failed_after_http11_retry_and_host_fallback\n' > evidence/nepse/CAPTURE_FAILED.txt
          fi
      - name: Probe official NEPSE holiday API
        shell: bash
        run: |
          mkdir -p evidence/nepse-api
          url="https://nepalstock.com.np/api/nots/holiday/list?year=2026"
          status="$(curl --silent --show-error --http1.1 --location --max-time 90 \
            --dump-header evidence/nepse-api/response-headers.txt \
            --output evidence/nepse-api/response-body.bin \
            --write-out '%{http_code}' \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Referer: https://nepalstock.com.np/' \
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36' \
            "$url" || true)"
          printf '%s\n' "$url" > evidence/nepse-api/source-url.txt
          printf '%s\n' "$status" > evidence/nepse-api/http-status.txt
          if [ "$status" = "200" ]; then
            sha256sum evidence/nepse-api/response-body.bin > evidence/nepse-api/SHA256SUMS
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/nepse-api/response-body.bin")
          body = p.read_bytes()
          try:
              parsed = json.loads(body)
              Path("evidence/nepse-api/parsed-response.json").write_text(json.dumps(parsed, indent=2, ensure_ascii=False) + "\n")
              shape = type(parsed).__name__
          except Exception as exc:
              shape = "not_json:" + type(exc).__name__
          Path("evidence/nepse-api/response-analysis.txt").write_text(f"bytes={len(body)}\\njson_shape={shape}\\n")
          print(f"NEPSE holiday API returned HTTP 200; {len(body)} bytes; {shape}")
          PY
          else
            printf 'Unauthenticated endpoint probe did not return HTTP 200. Preserve status and headers; do not treat body as holiday evidence.\n' > evidence/nepse-api/PROBE_LIMITATION.txt
            sha256sum evidence/nepse-api/response-body.bin > evidence/nepse-api/SHA256SUMS
          fi
      - name: Capture NEPSE holidays through the public client flow
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "nepse-client==0.1.4"
          python backend/capture_nepse_holiday_evidence.py \
            --year 2026 \
            --output-dir evidence/nepse-api-authenticated || true
      - name: Commit captured primary source evidence
        shell: bash
        run: |
          set -euo pipefail
          target="data/evidence/raw/cdsc/2026-11-25"
          mkdir -p "$target"
          if [ -f evidence/cdsc/clearing-members.csv ]; then
            cp evidence/cdsc/clearing-members.csv "$target/clearing-members.csv"
            cp evidence/cdsc/response-headers.txt "$target/response-headers.txt"
            cp evidence/cdsc/source-url.txt "$target/source-url.txt"
            sha256sum "$target/clearing-members.csv" > "$target/SHA256SUMS"
            cp evidence/cdsc/capture-report.json "$target/capture-report.json"
          fi
          if [ -f evidence/nepse/holiday-listing.html ] || [ -f evidence/nepse/CAPTURE_FAILED.txt ]; then
            mkdir -p data/evidence/raw/nepse/holiday-listing/2026-11-25
            cp evidence/nepse/* data/evidence/raw/nepse/holiday-listing/2026-11-25/ || true
          fi
          if [ -d evidence/nepse-api ]; then
            mkdir -p data/evidence/raw/nepse/holiday-api/2026-11-25
            cp evidence/nepse-api/* data/evidence/raw/nepse/holiday-api/2026-11-25/ || true
          fi
          if [ -d evidence/nepse-api-authenticated ]; then
            mkdir -p data/evidence/raw/nepse/holiday-api-authenticated/2026-11-25
            cp evidence/nepse-api-authenticated/* data/evidence/raw/nepse/holiday-api-authenticated/2026-11-25/ || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence/raw/
          if ! git diff --cached --quiet; then
            git commit -m "data: archive captured primary reference evidence"
            git pull --rebase origin main
            git push
          else
            echo "No new raw evidence bytes to commit."
          fi
      - name: Upload immutable capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: primary-reference-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
