name: Frontend build and smoke checks
on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/app/main.py'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned chart dependency
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks and isolated build
        working-directory: frontend
        run: |
          npm run check
          npm run build
          test -s public-build/vendor/lightweight-charts.standalone.production.mjs
          test -s public-build/vendor/LICENSE
          test -s public-build/vendor/NOTICE
      - name: Chromium interaction tests
        working-directory: frontend
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public-build &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node broker-browser-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nepse-research-terminal
          path: frontend/public-build/
          if-no-files-found: error
