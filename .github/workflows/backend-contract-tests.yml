name: Backend contract tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-contract-tests.yml"

permissions:
  contents: read

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Install shared validation package
        run: python -m pip install "git+https://github.com/jaljala044/nepse-smc-data.git@fd604c893cf13a8d3daf9ae6f685ac6a841cc82d"
      - name: Run backend unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
