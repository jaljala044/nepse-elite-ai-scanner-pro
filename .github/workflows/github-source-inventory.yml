name: github-source-inventory

on:
  push:
    branches: [main]
    paths:
      - "backend/inventory_github_sources.py"
      - ".github/workflows/github-source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install inventory dependency
        run: python -m pip install "httpx>=0.27,<1"
      - name: Inventory public archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/inventory_github_sources.py \
            --repo jaljala044/nepse-smc-data \
            --repo jaljala044/nepse-history-starter \
            --repo socrateai-official/nepse-open-data \
            --repo SamirWagle/Nepse-All-Scraper \
            --repo srijankarki07/nepse-data \
            --output data/reports/github-source-inventory.json
      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: nepse-github-source-inventory
          path: data/reports/github-source-inventory.json
          if-no-files-found: error
          retention-days: 30
