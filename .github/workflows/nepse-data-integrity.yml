name: NEPSE historical data integrity

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/hf_dataset_collector.py"
      - "backend/app/coverage_matrix.py"
      - "backend/derive_broker_party_observations.py"
      - "backend/tests/test_derive_broker_party_observations.py"
      - "data/raw/acquired/rajeevpaudel-nepse-history/2026/2026-11-19-floorsheet.csv"
      - "backend/run_hf_inventory.py"
      - "backend/tests/**"
      - ".github/workflows/nepse-data-integrity.yml"

permissions:
  contents: read

jobs:
  tests-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependency
        run: python -m pip install --upgrade pip httpx
      - name: Test Hugging Face collector
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_hf_dataset_collector.py' -v
      - name: Test coverage matrix
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_coverage_matrix.py' -v
      - name: Test row-level OHLCV reconciliation
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_ohlcv_reconciliation.py' -v
      - name: Test broker party derivation
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_derive_broker_party_observations.py' -v
      - name: Derive broker party observations from pinned raw sample
        working-directory: backend
        run: |
          python derive_broker_party_observations.py \
            --input ../data/raw/acquired/rajeevpaudel-nepse-history/2026/2026-11-19-floorsheet.csv \
            --source-id rajeevpaudel/nepse-history \
            --expected-sha256 771d856187844f5608cb31225c03d065a4ce13fe655601d465c4e167a7b62e15 \
            --date 2026-11-19 \
            --expected-rows 40818 \
            --party-output ../artifacts/broker-derivation-2026-11-19/broker-party-observations.csv \
            --aggregate-output ../artifacts/broker-derivation-2026-11-19/broker-aggregates.json
      - name: Generate pinned Hugging Face inventory
        working-directory: backend
        run: python run_hf_inventory.py --max-files 10000
      - name: Build source-separated date coverage report
        working-directory: backend
        run: |
          manifest="$(find ../data/raw/huggingface/manifests -type f -name '*.json' | sort | tail -n 1)"
          test -n "$manifest"
          python build_coverage_matrix.py \
            --calendar ../data/reference/nepse-session-calendar-candidates-2026.csv \
            --manifest "$manifest" \
            --output ../data/reports/hf-source-coverage-candidates.json
      - name: Upload inventory and coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: nepse-historical-data-audit
          path: |
            data/raw/huggingface/manifests/*.json
            data/reports/hf-source-coverage-candidates.json
            artifacts/broker-derivation-2026-11-19/*
          if-no-files-found: error
          retention-days: 30
