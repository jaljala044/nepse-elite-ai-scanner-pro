name: hf-dataset-inventory

on:
  push:
    branches: [main]
    paths:
      - "backend/app/hf_dataset_collector.py"
      - "backend/inventory_hf_datasets.py"
      - "backend/acquire_floorsheet_archive.py"
      - "backend/acquire_hf_floorsheet_sample.py"
      - "backend/acquire_github_floorsheet_sample.py"
      - "backend/compare_floorsheet_samples.py"
      - "backend/tests/test_compare_floorsheet_samples.py"
      - "backend/tests/test_acquire_github_floorsheet_sample.py"
      - "backend/audit_hf_floorsheet_sample.py"
      - "backend/tests/test_audit_hf_floorsheet_sample.py"
      - "backend/tests/test_acquire_hf_floorsheet_sample.py"
      - "backend/build_calendar_coverage_matrix.py"
      - "backend/build_recent_history_target.py"
      - "backend/tests/test_recent_history_target.py"
      - "data/reference/nepse_session_calendar.csv"
      - "data/reference/nepse_calendar_evidence_leads_2026.csv"
      - ".github/workflows/hf-dataset-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-public-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Inventory public Hugging Face datasets
        run: python inventory_hf_datasets.py --output ../data/reports/hf-dataset-inventory-summary.json
        working-directory: backend
      - name: Enumerate Urekmazino floorsheet archive (manifest only)
        run: >-
          python acquire_hf_floorsheet_archive.py
          --repo-id urekmazino69/Nepse-floorsheet-and-indices
          --path floorsheet
          --revision main
          --output ../artifacts/source-manifests
        working-directory: backend
      - name: Acquire one MIT-declared Urekmazino floorsheet sample (pinned, hash-verified)
        run: >-
          python acquire_hf_floorsheet_sample.py
          --repo-id urekmazino69/Nepse-floorsheet-and-indices
          --path floorsheet
          --revision 11ef83a9c3cdbe78112f0245451cdc52bdb1a8f0
          --date 2026-08-26
          --confirm-data-rights
          --max-total-bytes 50000000
          --raw-root ../data/raw/huggingface
          --output ../data/reports/hf-floorsheet-sample.json
        working-directory: backend
      - name: Acquire matching Urekmazino index control-total sample (pinned, hash-verified)
        run: >-
          python acquire_hf_floorsheet_sample.py
          --repo-id urekmazino69/Nepse-floorsheet-and-indices
          --path indices
          --revision 11ef83a9c3cdbe78112f0245451cdc52bdb1a8f0
          --date 2026-08-26
          --confirm-data-rights
          --max-total-bytes 10000000
          --raw-root ../data/raw/huggingface
          --output ../data/reports/hf-index-sample.json
        working-directory: backend
      - name: Fetch pinned SocrateAI index row for independent turnover corroboration
        run: |
          mkdir -p data/raw/reference
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/socrateai-official/nepse-open-data/cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3/ohlc_index/adj_2026-08-26.csv \
            -o data/raw/reference/socrateai-adj-index-2026-08-26.csv
      - name: Acquire one SocrateAI floorsheet comparison sample (pinned, Git-blob verified)
        run: >-
          python acquire_github_floorsheet_sample.py
          --owner socrateai-official
          --repo nepse-open-data
          --revision cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3
          --prefix floorsheet
          --date 2026-08-26
          --confirm-data-rights
          --max-total-bytes 10000000
          --raw-root ../data/raw/floorsheet
          --output ../data/reports/socrateai-floorsheet-sample.json
        working-directory: backend
      - name: Audit raw floorsheet sample against same-day index controls
        run: |
          commit=11ef83a9c3cdbe78112f0245451cdc52bdb1a8f0
          floor_file=$(find data/raw/huggingface/urekmazino69/Nepse-floorsheet-and-indices/$commit/floorsheet -maxdepth 1 -type f -name '2026-08-26.csv*' -print -quit)
          index_file=$(find data/raw/huggingface/urekmazino69/Nepse-floorsheet-and-indices/$commit/indices -maxdepth 1 -type f -name '2026-08-26.csv*' -print -quit)
          test -n "$floor_file"
          test -n "$index_file"
          python backend/audit_hf_floorsheet_sample.py \
            --floorsheet "$floor_file" \
            --index "$index_file" \
            --reference-index data/raw/reference/socrateai-adj-index-2026-08-26.csv \
            --date 2026-08-26 \
            --output data/reports/hf-floorsheet-sample-audit.json
      - name: Compare same-day Urek and SocrateAI floorsheet transactions
        if: always()
        run: |
          python backend/compare_floorsheet_samples.py \
            --urek data/raw/huggingface/urekmazino69/Nepse-floorsheet-and-indices/11ef83a9c3cdbe78112f0245451cdc52bdb1a8f0/floorsheet/2026-08-26.csv.gz \
            --socrateai data/raw/floorsheet/socrateai-official/nepse-open-data/cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3/floorsheet/floorsheet_2026-08-26.csv \
            --date 2026-08-26 \
            --output data/reports/floorsheet-cross-source-sample.json
      - name: Enumerate SocrateAI GitHub floorsheet archive (manifest only)
        if: always()
        run: >-
          python acquire_floorsheet_archive.py
          --owner socrateai-official
          --repo nepse-open-data
          --ref main
          --prefix floorsheet
          --output ../artifacts/source-manifests
        working-directory: backend
      - name: Enumerate SamirWagle GitHub floorsheet archive (manifest only)
        if: always()
        run: >-
          python acquire_floorsheet_archive.py
          --owner SamirWagle
          --repo Nepse-All-Scraper
          --ref main
          --prefix data/floorsheet
          --output ../artifacts/source-manifests
        working-directory: backend
      - name: Build date-level NEPSE calendar and source coverage matrix
        if: always()
        run: |
          mapfile -t manifests < <(find ../artifacts/source-manifests -maxdepth 1 -type f -name '*.jsonl' | sort)
          args=()
          for manifest in "${manifests[@]}"; do args+=(--manifest "$manifest"); done
          python build_calendar_coverage_matrix.py "${args[@]}" --calendar ../data/reference/nepse_session_calendar.csv --start-date 2024-01-02 --end-date 2026-11-24 --output ../artifacts/source-manifests/nepse-calendar-coverage-matrix.json
          python build_recent_history_target.py "${args[@]}" --calendar ../data/reference/nepse_session_calendar.csv --minimum-sessions 90 --target-sessions 120 --output ../artifacts/source-manifests/recent-90-120-session-target.json
        working-directory: backend
      - name: Upload inventory manifest and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-hf-data-inventory
          path: |
            data/raw/huggingface/manifests/
            data/reports/hf-dataset-inventory-summary.json
            data/reports/hf-floorsheet-sample.json
            data/reports/hf-index-sample.json
            data/reports/hf-floorsheet-sample-audit.json
            data/raw/huggingface/
            data/raw/floorsheet/
            data/reports/socrateai-floorsheet-sample.json
            data/reports/floorsheet-cross-source-sample.json
            data/raw/reference/socrateai-adj-index-2026-08-26.csv
            artifacts/source-manifests/
          if-no-files-found: error
          retention-days: 90
