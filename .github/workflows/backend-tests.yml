name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Install shared validation package
        run: python -m pip install "git+https://github.com/jaljala044/nepse-smc-data.git@fd604c893cf13a8d3daf9ae6f685ac6a841cc82d"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
        working-directory: backend
