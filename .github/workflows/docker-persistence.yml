name: Docker persistence acceptance

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - "backend/**"
      - "scripts/verify_docker_persistence.py"
      - ".github/workflows/docker-persistence.yml"

permissions:
  contents: read

jobs:
  restart-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start disposable API
        run: docker compose up --build --detach
      - name: Verify synthetic row survives container restart
        run: python scripts/verify_docker_persistence.py
      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable containers and volume
        if: always()
        run: docker compose down --volumes --remove-orphans
