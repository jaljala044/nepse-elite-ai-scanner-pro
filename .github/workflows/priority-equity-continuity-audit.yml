name: Priority equity continuity audit
on:
  pull_request:
    paths:
      - 'backend/audit_priority_equity_continuity.py'
      - 'backend/classify_historical_continuity_gaps.py'
      - 'backend/crosscheck_unresolved_equity_gaps.py'
      - 'backend/crosscheck_sharesansar_no_trade.py'
      - 'backend/build_historical_research_overlay.py'
      - 'data/reference/historical_listing_evidence_candidates_2026-11-26.csv'
      - 'data/reference/pfl_suspension_evidence_2026-11-26.csv'
      - '.github/workflows/priority-equity-continuity-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire public historical archive
        run: git clone --mirror https://github.com/jaljala044/nepse-history-starter.git /tmp/nepse-history.git
      - name: Audit remaining priority equities
        run: |
          python backend/audit_priority_equity_continuity.py --archive /tmp/nepse-history.git --queue data/reference/historical_continuity_review_queue_2026-11-26.csv --sessions data/reference/historical_120_observed_sessions_review_2026-11-26.csv --output /tmp/audit/remaining_223.csv
      - name: Audit exception equities
        run: |
          python backend/audit_priority_equity_continuity.py --archive /tmp/nepse-history.git --queue data/reference/historical_continuity_review_queue_2026-11-26.csv --sessions data/reference/historical_120_observed_sessions_review_2026-11-26.csv --group exception_review --skip 0 --output /tmp/audit/exception_26.csv
      - name: Classify missing observations
        run: |
          python backend/validate_equity_lifecycle_input.py --lifecycle data/reference/nepse_equity_lifecycle_coverage_input_2026-11-26.csv --crosswalk data/reference/nepse_equity_security_id_crosswalk_2026-11-26.csv
          python backend/classify_historical_continuity_gaps.py --audits data/reference/historical_continuity_batch_00*_2026-11-26.csv /tmp/audit/remaining_223.csv /tmp/audit/exception_26.csv --lifecycle data/reference/nepse_equity_lifecycle_coverage_input_2026-11-26.csv --july data/reference/july24_separate_volume_observations_2026-11-26.csv --listing data/reference/historical_listing_evidence_candidates_2026-11-26.csv --suspension data/reference/pfl_suspension_evidence_2026-11-26.csv --output /tmp/audit/classified_gaps.csv
      - name: Crosscheck unresolved observations
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/socrateai-official/nepse-open-data.git /tmp/secondary
          git -C /tmp/secondary cat-file -e ffb4b0d4b348ed17d07236f914d3efbccac722f6^{commit}
          python backend/crosscheck_unresolved_equity_gaps.py --gaps /tmp/audit/classified_gaps.csv --repo /tmp/secondary --revision ffb4b0d4b348ed17d07236f914d3efbccac722f6 --output /tmp/audit/unresolved_crosscheck.csv
      - name: Compare separate ShareSansar daily capture
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/srijankarki07/nepse-data.git /tmp/sharesansar
          python backend/crosscheck_sharesansar_no_trade.py --gaps /tmp/audit/unresolved_crosscheck.csv --repo /tmp/sharesansar --revision 688d59c03915dcee73ecad4230d2083a41c61764 --output /tmp/audit/sharesansar_crosscheck.csv
      - name: Build separate historical research overlay
        run: |
          python backend/build_historical_research_overlay.py --archive /tmp/nepse-history.git --queue data/reference/historical_continuity_review_queue_2026-11-26.csv --sessions data/reference/historical_120_observed_sessions_review_2026-11-26.csv --candidates data/reference/july24_historical_recovery_candidates_2026-11-26.csv --secondary /tmp/sharesansar --gaps /tmp/audit/classified_gaps.csv --output /tmp/audit/research_overlay.csv --coverage /tmp/audit/stock_coverage.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-223-equity-audit
          path: /tmp/audit/*.csv
          if-no-files-found: error
