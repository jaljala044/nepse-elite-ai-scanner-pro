name: Frontend build and deployment image checks
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/Dockerfile"
      - "backend/app/**"
      - "data/reference/**"
      - ".github/workflows/frontend-build.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/Dockerfile"
      - "backend/app/**"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned chart dependency
        working-directory: frontend
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Syntax checks and frontend build
        working-directory: frontend
        run: |
          npm run check
          npm run build
          test -s public-build/index.html
          test -s public-build/scanner.js
          test -s public-build/styles.css
          test -s public-build/vendor/lightweight-charts.standalone.production.mjs
          test -s public-build/vendor/LICENSE
          test -s public-build/vendor/NOTICE
      - name: Build deployable application image
        run: docker build -f backend/Dockerfile -t nepse-research:ci .
      - name: Smoke-test packaged API and terminal routes
        run: |
          docker run -d --name nepse-terminal -p 8000:8000 nepse-research:ci
          python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          base = "http://127.0.0.1:8000"
          for attempt in range(30):
              try:
                  with urlopen(base + "/health", timeout=2) as response:
                      assert response.status == 200
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          for path, expected in [
              ("/terminal/", b"NEPSE SCANNER"),
              ("/terminal/scanner.js", b"/v1/scan/market-wide"),
          ]:
              with urlopen(base + path, timeout=5) as response:
                  body = response.read()
                  assert response.status == 200 and expected in body, path
          with urlopen(base + "/v1/research/readiness", timeout=5) as response:
              readiness = json.loads(response.read())
          assert readiness["universe_available"] is True, readiness
          assert readiness["candidate_equities"] == 281, readiness
          assert readiness["canonical_reviewed_rows"] == 0, readiness
          with urlopen(base + "/v1/symbols", timeout=5) as response:
              symbols = json.loads(response.read())
          assert symbols["count"] == 0, symbols
          assert symbols["candidate_universe_count"] == 281, symbols
          request = Request(base + "/v1/scan/market-wide", data=b"{}", headers={"Content-Type": "application/json"}, method="POST")
          with urlopen(request, timeout=30) as response:
              scan = json.loads(response.read())
          assert scan["scanner_id"] == "3A.01", scan
          assert scan["candidate_universe_count"] == 281, scan
          assert scan["symbols_with_observations"] == 0, scan
          assert scan["symbols_without_observations"] == 281, scan
          assert scan["observation_coverage_pct"] == 0.0, scan
          assert scan["ranking_enabled"] is False, scan
          assert len(scan["results"]) == 281, len(scan["results"])
          print("Container health, packaged terminal, candidate manifest and full-universe fail-closed scan passed.")
          PY
      - name: Remove smoke-test container
        if: always()
        run: docker rm -f nepse-terminal || true
      - name: Build private research deployment image
        run: docker build -f Dockerfile.research -t nepse-research-private:ci .
      - name: Smoke-test private deployment authentication boundary
        env:
          NEPSE_PROXY_SECRET: ci-only-secret-value-at-least-32-characters-long
        run: |
          docker run -d --name nepse-private-terminal -p 8001:8000 \
            -e NEPSE_DEPLOYMENT_MODE=private \
            -e NEPSE_PROXY_SECRET="$NEPSE_PROXY_SECRET" \
            nepse-research-private:ci
          python - <<'PY'
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8001"
          secret = "ci-only-secret-value-at-least-32-characters-long"

          def request(path, headers=None, expected=200):
              req = Request(base + path, headers=headers or {})
              try:
                  with urlopen(req, timeout=5) as response:
                      status = response.status
              except HTTPError as exc:
                  status = exc.code
              assert status == expected, (path, status, expected)

          for attempt in range(30):
              try:
                  request("/health")
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(2)

          request("/health", expected=200)
          request("/v1/research/readiness", expected=401)
          request("/terminal/", expected=401)
          request("/v1/research/readiness", {"X-NEPSE-Subject": "forged-user"}, expected=401)
          trusted = {
              "X-NEPSE-Subject": "ci-verified-user",
              "X-NEPSE-Proxy-Secret": secret,
          }
          request("/v1/research/readiness", trusted, expected=200)
          request("/terminal/", trusted, expected=200)
          print("Private image health exception, unauthenticated denial and trusted-proxy access passed.")
          PY
      - name: Remove private smoke-test container
        if: always()
        run: docker rm -f nepse-private-terminal || true
      - uses: actions/upload-artifact@v4
        with:
          name: nepse-research-terminal
          path: frontend/public-build/
          if-no-files-found: error
