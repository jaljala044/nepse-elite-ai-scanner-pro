name: P4.17 pinned floorsheet archive reconciliation

on:
  push:
    branches: [main]
    paths:
      - "backend/app/floorsheet_archive_pair_audit.py"
      - "backend/audit_floorsheet_archive_pair.py"
      - "backend/app/floorsheet_source_profiles.py"
      - "backend/app/floorsheet_contract.py"
      - "backend/app/floorsheet_cross_source.py"
      - "backend/audit_floorsheet_symbol_scope.py"
      - "backend/audit_floorsheet_archive_window.py"
      - "backend/audit_floorsheet_one_sided_scope.py"
      - "backend/audit_floorsheet_eod_controls.py"
      - "backend/audit_official_market_summary_reconciliation.py"
      - "backend/audit_official_security_history_vs_floorsheet.py"
      - "backend/tests/test_floorsheet_archive_window.py"
      - "backend/tests/test_floorsheet_one_sided_scope.py"
      - "backend/tests/test_floorsheet_eod_controls.py"
      - "backend/tests/test_official_market_summary_reconciliation.py"
      - "backend/tests/test_official_security_history_vs_floorsheet.py"
      - "backend/tests/test_floorsheet_symbol_scope.py"
      - "data/reference/nepse_equity_security_id_crosswalk_2026-11-26.csv"
      - "data/reference/nepse_target_universe_candidates_2026-11-26.csv"
      - "data/reference/nepse_security_id_snapshot_2026-11-25.csv"
      - ".github/workflows/p417-pinned-archive-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-pinned-2026-11-24-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test floorsheet symbol scope audit
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_floorsheet_symbol_scope.py' -v

      - name: Test multi-date pinned archive verifier
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_floorsheet_archive_window.py' -v

      - name: Test dated scope classification of one-sided contracts
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_floorsheet_one_sided_scope.py' -v

      - name: Test official NEPSE aggregate reconciliation
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_official_market_summary_reconciliation.py' -v

      - name: Test official per-security history reconciliation
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_official_security_history_vs_floorsheet.py' -v

      - name: Test floorsheet to EOD control reconciliation
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_floorsheet_eod_controls.py' -v

      - name: Fetch exact pinned Samir raw CSV
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SamirWagle/Nepse-All-Scraper/e6160adc6bdf3d19562167388e3d9d4f645c455a/data/floorsheet/floorsheet_2026-11-24.csv \
            -o /tmp/samir-floorsheet-2026-11-24.csv
          sha256sum /tmp/samir-floorsheet-2026-11-24.csv

      - name: Fetch exact pinned SocrateAI raw CSV
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/socrateai-official/nepse-open-data/cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3/floorsheet/floorsheet_2026-11-24.csv \
            -o /tmp/socrateai-floorsheet-2026-11-24.csv
          sha256sum /tmp/socrateai-floorsheet-2026-11-24.csv

      - name: Verify exact pinned identities and reconcile all contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SAMIR_SHA256="$(sha256sum /tmp/samir-floorsheet-2026-11-24.csv | cut -d ' ' -f 1)"
          SOCRATEAI_SHA256="$(sha256sum /tmp/socrateai-floorsheet-2026-11-24.csv | cut -d ' ' -f 1)"
          python backend/audit_floorsheet_archive_pair.py \
            --left-file /tmp/samir-floorsheet-2026-11-24.csv \
            --left-source-id "SamirWagle/Nepse-All-Scraper@e6160adc6bdf3d19562167388e3d9d4f645c455a" \
            --left-profile samir \
            --left-sha256 "$SAMIR_SHA256" \
            --right-file /tmp/socrateai-floorsheet-2026-11-24.csv \
            --right-source-id "socrateai-official/nepse-open-data@cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3" \
            --right-profile socrateai \
            --right-sha256 "$SOCRATEAI_SHA256" \
            --output artifacts/p417-floorsheet-pair-audit-2026-11-24.json

      - name: Fetch additional overlapping pinned archive dates
        run: |
          set -euo pipefail
          mkdir -p /tmp/pinned-window
          cp /tmp/samir-floorsheet-2026-11-24.csv /tmp/pinned-window/samir-2026-11-24.csv
          cp /tmp/socrateai-floorsheet-2026-11-24.csv /tmp/pinned-window/socrateai-2026-11-24.csv
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SamirWagle/Nepse-All-Scraper/e6160adc6bdf3d19562167388e3d9d4f645c455a/data/floorsheet/floorsheet_2026-11-19.csv \
            -o /tmp/pinned-window/samir-2026-11-19.csv
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SamirWagle/Nepse-All-Scraper/e6160adc6bdf3d19562167388e3d9d4f645c455a/data/floorsheet/floorsheet_2026-11-20.csv \
            -o /tmp/pinned-window/samir-2026-11-20.csv
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/socrateai-official/nepse-open-data/cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3/floorsheet/floorsheet_2026-11-19.csv \
            -o /tmp/pinned-window/socrateai-2026-11-19.csv
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/socrateai-official/nepse-open-data/cfa92493e93211c7019a5cd0b2cbe7d400d9c4e3/floorsheet/floorsheet_2026-11-20.csv \
            -o /tmp/pinned-window/socrateai-2026-11-20.csv

      - name: Fetch pinned third-party daily EOD controls
        run: |
          set -euo pipefail
          mkdir -p /tmp/eod-controls
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/srijankarki07/nepse-data/688d59c03915dcee73ecad4230d2083a41c61764/data/daily/2026/2026-11-19.csv \
            -o /tmp/eod-controls/eod-2026-11-19.csv
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/srijankarki07/nepse-data/688d59c03915dcee73ecad4230d2083a41c61764/data/daily/2026/2026-11-20.csv \
            -o /tmp/eod-controls/eod-2026-11-20.csv
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/srijankarki07/nepse-data/688d59c03915dcee73ecad4230d2083a41c61764/data/daily/2026/2026-11-24.csv \
            -o /tmp/eod-controls/eod-2026-11-24.csv

      - name: Reconcile three overlapping pinned dates
        run: |
          set -euo pipefail
          python backend/audit_floorsheet_archive_window.py \
            --input-dir /tmp/pinned-window \
            --output artifacts/p419-three-date-floorsheet-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p419-three-date-floorsheet-audit.json").read_text())
          summary = {
              "audit_status": report["audit_status"],
              "dates": {day: item["summary"] for day, item in report["date_reports"].items()},
              "source_independence_verified": False,
              "daily_capture_completeness_verified": False,
              "canonical_promotion_allowed": False,
          }
          rendered = json.dumps(summary, indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.19 multi-date archive comparison\\n\\n")
              stream.write("```json\\n" + rendered + "\\n```\\n")
          PY

      - name: Fetch immutable official NEPSE market-summary capture
        run: |
          set -euo pipefail
          mkdir -p /tmp/official-summary
          base="https://raw.githubusercontent.com/jaljala044/nepse-elite-ai-scanner-pro/043344174e7f048560a112c294d11a727289ac87/data/evidence/raw/nepse/market-summary-history/2026-11-26"
          curl --fail --silent --show-error --location "$base/response-body.bin" -o /tmp/official-summary/response-body.bin
          curl --fail --silent --show-error --location "$base/capture-report.json" -o /tmp/official-summary/capture-report.json
          sha256sum /tmp/official-summary/response-body.bin /tmp/official-summary/capture-report.json

      - name: Reconcile pinned floorsheet totals with official NEPSE aggregates
        run: |
          set -euo pipefail
          python backend/audit_official_market_summary_reconciliation.py \
            --official-capture-dir /tmp/official-summary \
            --floorsheet-dir /tmp/pinned-window \
            --output artifacts/p421-official-market-summary-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p421-official-market-summary-reconciliation.json").read_text())
          rendered = json.dumps({
              "official_capture": report["official_capture"],
              "date_reports": report["date_reports"],
              "floorsheet_source_independence_verified": False,
              "per_security_completeness_verified": False,
              "coverage_admission_allowed": False,
          }, indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.21 official NEPSE aggregate reconciliation\\n\\n")
              stream.write("```json\\n" + rendered + "\\n```\\n")
          PY

      - name: Fetch immutable official daily per-security history responses
        run: |
          set -euo pipefail
          mkdir -p /tmp/official-daily
          base="https://raw.githubusercontent.com/jaljala044/nepse-elite-ai-scanner-pro/069395e1153b1f49ed771774995022382d2b1863/data/evidence/raw/nepse/daily-security-prices/2026-11-19_20_24"
          for day in 2026-11-19 2026-11-20 2026-11-24; do
            curl --fail --silent --show-error --location "$base/$day-parsed-response.json" -o "/tmp/official-daily/$day-parsed-response.json"
          done
          sha256sum /tmp/official-daily/*

      - name: Reconcile official per-security rows with both floorsheet archives
        run: |
          set -euo pipefail
          python backend/audit_official_security_history_vs_floorsheet.py \
            --official-dir /tmp/official-daily \
            --floorsheet-dir /tmp/pinned-window \
            --security-snapshot data/reference/nepse_security_id_snapshot_2026-11-25.csv \
            --output artifacts/p422-official-per-security-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p422-official-per-security-reconciliation.json").read_text())
          rendered = json.dumps(report["dates"], indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.22 official per-security floorsheet reconciliation\\n\\n")
              stream.write("\`\`\`json\\n" + rendered + "\\n\`\`\`\\n")
          PY

      - name: Reconcile floorsheet per-symbol aggregates with pinned EOD controls
        run: |
          set -euo pipefail
          python backend/audit_floorsheet_eod_controls.py \
            --floorsheet-dir /tmp/pinned-window \
            --eod-dir /tmp/eod-controls \
            --output artifacts/p421-floorsheet-eod-controls.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p421-floorsheet-eod-controls.json").read_text())
          rendered = json.dumps({
              "dates": {
                  day: {
                      "status_counts": item["status_counts"],
                      "total_differences": item["total_differences"],
                      "floorsheet_symbol_count": item["floorsheet_symbol_count"],
                      "eod_symbol_count": item["eod_symbol_count"],
                  }
                  for day, item in report["date_reports"].items()
              },
              "source_independence_verified": False,
              "coverage_admission_allowed": False,
          }, indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.21 third-party EOD aggregate cross-check\\n\\n")
              stream.write("```json\\n" + rendered + "\\n```\\n")
          PY

      - name: Classify one-sided contracts against dated instrument registry
        run: |
          set -euo pipefail
          python backend/audit_floorsheet_one_sided_scope.py \
            --audit artifacts/p419-three-date-floorsheet-audit.json \
            --equity-crosswalk data/reference/nepse_equity_security_id_crosswalk_2026-11-26.csv \
            --target-candidates data/reference/nepse_target_universe_candidates_2026-11-26.csv \
            --security-snapshot data/reference/nepse_security_id_snapshot_2026-11-25.csv \
            --expected-snapshot-date 2026-11-25 \
            --output artifacts/p420-one-sided-instrument-scope.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p420-one-sided-instrument-scope.json").read_text())
          rendered = json.dumps({
              "one_sided_contract_count": report["one_sided_contract_count"],
              "scope_class_counts": report["scope_class_counts"],
              "date_summaries": report["date_summaries"],
              "date_symbol_aggregates": report["date_symbol_aggregates"],
              "scope_classification_basis": report["scope_classification_basis"],
              "historical_security_identity_verified": False,
              "unknown_contract_count": sum(
                  row["scope_class"] in {"UNKNOWN_NO_SECURITY_SNAPSHOT_MATCH", "UNCLASSIFIED_SECURITY_SNAPSHOT_ONLY"}
                  for row in report["one_sided_contracts"]
              ),
              "coverage_admission_allowed": False,
              "canonical_promotion_allowed": False,
          }, indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.20 one-sided instrument scope classification\\n\\n")
              stream.write("```json\\n" + rendered + "\\n```\\n")
          PY

      - name: Reconcile all observed symbols to dated instrument scope
        run: |
          set -euo pipefail
          python backend/audit_floorsheet_symbol_scope.py \
            --samir /tmp/samir-floorsheet-2026-11-24.csv \
            --socrateai /tmp/socrateai-floorsheet-2026-11-24.csv \
            --equity-crosswalk data/reference/nepse_equity_security_id_crosswalk_2026-11-26.csv \
            --target-candidates data/reference/nepse_target_universe_candidates_2026-11-26.csv \
            --security-snapshot data/reference/nepse_security_id_snapshot_2026-11-25.csv \
            --expected-trade-date 2026-11-24 \
            --expected-snapshot-date 2026-11-25 \
            --output artifacts/p418-floorsheet-symbol-scope-2026-11-24.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p418-floorsheet-symbol-scope-2026-11-24.json").read_text())
          summary = {
              "unique_symbols_observed": report["unique_symbols_observed"],
              "source_rows": report["source_rows"],
              "registry_rows": report["registry_rows"],
              "scope_class_counts": report["scope_class_counts"],
              "unobserved_equity_crosswalk_symbol_count": len(report["unobserved_equity_crosswalk_symbols"]),
              "unobserved_equity_crosswalk_symbols": report["unobserved_equity_crosswalk_symbols"],
              "unobserved_mutual_fund_candidate_symbols": report["unobserved_mutual_fund_candidate_symbols"],
              "unobserved_target_equity_candidate_symbols": report["unobserved_target_equity_candidate_symbols"],
              "unobserved_target_candidate_symbols": report["unobserved_target_candidate_symbols"],
              "unknown_symbols": [row["symbol"] for row in report["symbols"] if row["scope_class"] == "UNKNOWN_NO_SECURITY_SNAPSHOT_MATCH"],
              "unclassified_snapshot_only_symbols": [row["symbol"] for row in report["symbols"] if row["scope_class"] == "UNCLASSIFIED_SECURITY_SNAPSHOT_ONLY"],
              "canonical_promotion_allowed": False,
              "coverage_admission_allowed": False,
          }
          rendered = json.dumps(summary, indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.18 observed symbol scope audit\\n\\n")
              stream.write("```json\\n" + rendered + "\\n```\\n")
          PY

      - name: Summarize reconciliation exceptions and coverage limits
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          report = json.loads(Path("artifacts/p417-floorsheet-pair-audit-2026-11-24.json").read_text())
          audit = report["audit"]
          comparison = audit["comparison"]
          identity = audit["identity_audit"]

          def compact_file(key):
              item = audit[key]
              reconciliation = item.get("row_reconciliation") or {}
              return {
                  "source_id": item["source_id"],
                  "input_rows": item["input_rows"],
                  "parsed_rows": item["parsed_rows"],
                  "rejected_rows": item["rejected_rows"],
                  "duplicate_counts": reconciliation.get("counts", {}),
                  "rejected_row_examples": item.get("rejected_row_ledger", [])[:10],
              }

          summary = {
              "audit_status": audit["audit_status"],
              "left": compact_file("left_file"),
              "right": compact_file("right_file"),
              "comparison": {
                  "comparison_status": comparison.get("comparison_status"),
                  "left_totals": comparison.get("left_totals"),
                  "right_totals": comparison.get("right_totals"),
                  "shared_contract_count": comparison.get("shared_contract_count"),
                  "exact_shared_contract_count": comparison.get("exact_shared_contract_count"),
                  "conflicting_shared_contract_count": comparison.get("conflicting_shared_contract_count"),
                  "left_only_count": len(comparison.get("left_only_contract_keys", [])),
                  "right_only_count": len(comparison.get("right_only_contract_keys", [])),
                  "conflict_examples": comparison.get("conflicts", [])[:10],
                  "left_only_contracts": comparison.get("left_only_contracts", []),
                  "right_only_contracts": comparison.get("right_only_contracts", []),
                  "one_sided_totals": {
                      "left_only_quantity": str(sum((Decimal(row["quantity"]) for row in comparison.get("left_only_contracts", [])), Decimal("0"))),
                      "left_only_gross_amount": str(sum((Decimal(row["amount"]) for row in comparison.get("left_only_contracts", [])), Decimal("0"))),
                      "right_only_quantity": str(sum((Decimal(row["quantity"]) for row in comparison.get("right_only_contracts", [])), Decimal("0"))),
                      "right_only_gross_amount": str(sum((Decimal(row["amount"]) for row in comparison.get("right_only_contracts", [])), Decimal("0"))),
                  },
              },
              "identity": {
                  "left_within_source_date_collisions": len(identity.get("left_within_source_date_collisions", [])),
                  "right_within_source_date_collisions": len(identity.get("right_within_source_date_collisions", [])),
                  "cross_source_date_disagreements": len(identity.get("cross_source_date_disagreements", [])),
                  "contract_prefix_date_findings": len(identity.get("contract_prefix_date_findings", [])),
                  "date_disagreement_examples": identity.get("cross_source_date_disagreements", [])[:10],
                  "prefix_examples": identity.get("contract_prefix_date_findings", [])[:10],
              },
              "source_independence_verified": False,
              "daily_capture_completeness_verified": False,
              "source_rights_verified": False,
              "coverage_admission_allowed": False,
              "canonical_promotion_allowed": False,
          }
          rendered = json.dumps(summary, indent=2, sort_keys=True)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## P4.17 floorsheet pair reconciliation\\n\\n")
              stream.write("```json\\n" + rendered + "\\n```\\n")
          PY

      - name: Upload review-only reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: p417-p419-floorsheet-reconciliation-2026-11-24
          path: |
            artifacts/p417-floorsheet-pair-audit-2026-11-24.json
            artifacts/p418-floorsheet-symbol-scope-2026-11-24.json
            artifacts/p419-three-date-floorsheet-audit.json
            artifacts/p420-one-sided-instrument-scope.json
            artifacts/p421-floorsheet-eod-controls.json
          if-no-files-found: error
          retention-days: 30
