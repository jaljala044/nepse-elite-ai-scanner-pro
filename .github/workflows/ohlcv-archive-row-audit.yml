name: ohlcv-archive-row-audit

on:
  push:
    branches: [main]
    paths:
      - "backend/audit_ohlcv_archives.py"
      - "backend/app/session_calendar.py"
      - "backend/tests/test_session_calendar.py"
      - "backend/tests/test_audit_ohlcv_archives.py"
      - "backend/crosscheck_ohlcv_socrateai.py"
      - "backend/build_market_date_crosscheck.py"
      - "backend/crosscheck_index_history_yonepse.py"
      - "backend/tests/test_crosscheck_index_history_yonepse.py"
      - "backend/acquire_floorsheet_archive.py"
      - "backend/tests/test_market_date_crosscheck.py"
      - "backend/tests/test_crosscheck_ohlcv_socrateai.py"
      - ".github/workflows/ohlcv-archive-row-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "httpx>=0.27,<1"
        working-directory: backend
      - name: Run parser tests
        run: python -m unittest tests.test_audit_ohlcv_archives tests.test_crosscheck_ohlcv_socrateai tests.test_market_date_crosscheck tests.test_crosscheck_index_history_yonepse -v
        working-directory: backend
      - name: Audit pinned Jaljala OHLCV archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/audit_ohlcv_archives.py \
            --repo jaljala044/nepse-smc-data \
            --repo jaljala044/nepse-history-starter \
            --workers 8 \
            --output data/reports/ohlcv-archive-audit.json
      - name: Cross-check flagged rows against SocrateAI unadjusted EOD
        if: always()
        run: |
          if test -f data/reports/ohlcv-archive-audit.json; then
            python backend/crosscheck_ohlcv_socrateai.py --input data/reports/ohlcv-archive-audit.json --output data/reports/ohlcv-socrateai-crosscheck.json
          else
            echo "No OHLCV audit report was produced; cannot cross-check."
            exit 1
          fi
      - name: Enumerate current SocrateAI floorsheet dates (manifest only)
        if: always()
        run: |
          python backend/acquire_floorsheet_archive.py \
            --owner socrateai-official --repo nepse-open-data --ref main \
            --prefix floorsheet --output artifacts/source-manifests
      - name: Enumerate current SamirWagle floorsheet dates (manifest only)
        if: always()
        run: |
          python backend/acquire_floorsheet_archive.py \
            --owner SamirWagle --repo Nepse-All-Scraper --ref main \
            --prefix data/floorsheet --output artifacts/source-manifests
      - name: Cross-check latest 120 index dates against audited OHLCV coverage
        if: always()
        run: |
          if test -f data/reports/ohlcv-archive-audit.json; then
            mapfile -t fs_manifests < <(find artifacts/source-manifests -maxdepth 1 -type f -name '*.jsonl' | sort)
            args=()
            for manifest in "${fs_manifests[@]}"; do args+=(--floorsheet-manifest "$manifest"); done
            python backend/build_market_date_crosscheck.py \
              --audit-report data/reports/ohlcv-archive-audit.json \
              --recent-index-dates 120 \
              --workers 8 \
              "${args[@]}" \
              --output data/reports/market-date-crosscheck.json
          else
            echo "No OHLCV audit report was produced; cannot build date cross-check."
            exit 1
          fi
      - name: Cross-check against YONEPSE official API-derived index mirror
        if: always()
        run: |
          if test -f data/reports/market-date-crosscheck.json; then
            python backend/crosscheck_index_history_yonepse.py \
              --input data/reports/market-date-crosscheck.json \
              --output data/reports/yonepse-index-crosscheck.json
          else
            echo "No market-date cross-check report exists; cannot compare YONEPSE mirror."
            exit 1
          fi
      - name: Upload OHLCV audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-ohlcv-row-audit
          path: |
            data/reports/ohlcv-archive-audit.json
            data/reports/ohlcv-socrateai-crosscheck.json
            data/reports/market-date-crosscheck.json
            data/reports/yonepse-index-crosscheck.json
            artifacts/source-manifests/*.jsonl
          if-no-files-found: warn
          retention-days: 30
