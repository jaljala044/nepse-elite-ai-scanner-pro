name: samir-merolagani-sample-audit

on:
  push:
    branches: [main]
    paths:
      - "backend/audit_samir_merolagani_capture.py"
      - "backend/tests/test_audit_samir_merolagani_capture.py"
      - ".github/workflows/samir-merolagani-sample-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-capture-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify audit unit tests
        run: python -m unittest tests.test_audit_samir_merolagani_capture -v
        working-directory: backend
      - name: Fetch pinned public source CSV
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SamirWagle/Nepse-All-Scraper/e6160adc6bdf3d19562167388e3d9d4f645c455a/data/floorsheet/floorsheet_2026-11-24.csv \
            -o /tmp/floorsheet_2026-11-24.csv
      - name: Verify exact pinned file and recompute all controls
        run: |
          python backend/audit_samir_merolagani_capture.py \
            --input /tmp/floorsheet_2026-11-24.csv \
            --output data/reports/samir-merolagani-capture-audit-2026-11-24.json
      - name: Upload audit report only (no raw CSV)
        uses: actions/upload-artifact@v4
        with:
          name: samir-merolagani-capture-audit-2026-11-24
          path: data/reports/samir-merolagani-capture-audit-2026-11-24.json
          if-no-files-found: error
          retention-days: 30
