name: ohlcv-archive-row-audit

on:
  push:
    branches: [main]
    paths:
      - "backend/audit_ohlcv_archives.py"
      - "backend/tests/test_audit_ohlcv_archives.py"
      - "backend/crosscheck_ohlcv_socrateai.py"
      - "backend/tests/test_crosscheck_ohlcv_socrateai.py"
      - ".github/workflows/ohlcv-archive-row-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install "httpx>=0.27,<1"
        working-directory: backend
      - name: Run parser tests
        run: python -m unittest tests.test_audit_ohlcv_archives -v
        working-directory: backend
      - name: Audit pinned Jaljala OHLCV archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/audit_ohlcv_archives.py \
            --repo jaljala044/nepse-smc-data \
            --repo jaljala044/nepse-history-starter \
            --workers 8 \
            --output data/reports/ohlcv-archive-audit.json
      - name: Cross-check flagged rows against SocrateAI unadjusted EOD
        if: always()
        run: |
          if test -f data/reports/ohlcv-archive-audit.json; then
            python backend/crosscheck_ohlcv_socrateai.py \\
              --input data/reports/ohlcv-archive-audit.json \\
              --output data/reports/ohlcv-socrateai-crosscheck.json
          else
            echo "No OHLCV audit report was produced; cannot cross-check."
            exit 1
          fi
      - name: Upload OHLCV audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-ohlcv-row-audit
          path: |
            data/reports/ohlcv-archive-audit.json
            data/reports/ohlcv-socrateai-crosscheck.json
          if-no-files-found: warn
          retention-days: 30
