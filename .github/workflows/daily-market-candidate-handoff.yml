name: Daily market candidate handoff

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: "Exact verified NEPSE session date (YYYY-MM-DD)"
        required: true
        type: string
      decision_time:
        description: "Timezone-aware decision timestamp"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nepse-market-candidate-handoff
  cancel-in-progress: false

jobs:
  generate-review-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Fetch protected signed input bundle
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          BUNDLE_BASE_URL: ${{ vars.NEPSE_INPUT_BUNDLE_BASE_URL }}
          BUNDLE_TOKEN: ${{ secrets.NEPSE_INPUT_BUNDLE_ACCESS_TOKEN }}
          BUNDLE_PUBLIC_KEY: ${{ vars.NEPSE_INPUT_BUNDLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$SESSION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$BUNDLE_BASE_URL" == https://* ]]
          test -n "$BUNDLE_TOKEN"
          test -n "$BUNDLE_PUBLIC_KEY"
          mkdir -p secure-input-bundles secure-input-signatures
          BASE="${BUNDLE_BASE_URL%/}"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-filesize 104857600 -H "Authorization: Bearer $BUNDLE_TOKEN" "$BASE/$SESSION_DATE.json" -o "secure-input-bundles/$SESSION_DATE.json"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-filesize 4096 -H "Authorization: Bearer $BUNDLE_TOKEN" "$BASE/$SESSION_DATE.sig" -o "secure-input-signatures/$SESSION_DATE.sig"
      - name: Generate review-only candidates
        working-directory: backend
        env:
          SESSION_DATE: ${{ inputs.session_date }}
          DECISION_TIME: ${{ inputs.decision_time }}
          NEPSE_INPUT_BUNDLE_PUBLIC_KEY: ${{ vars.NEPSE_INPUT_BUNDLE_PUBLIC_KEY }}
        run: |
          python run_daily_market_handoff.py \
            --bundle-dir ../secure-input-bundles \
            --signature-dir ../secure-input-signatures \
            --candidate-dir ../market-candidates \
            --trusted-registry ../deployment/market-registry.json \
            --session-date "$SESSION_DATE" \
            --decision-time "$DECISION_TIME" \
            --public-key-env NEPSE_INPUT_BUNDLE_PUBLIC_KEY
      - name: Upload review-only candidate artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-market-candidates-${{ inputs.session_date }}
          path: market-candidates/
          if-no-files-found: error
          retention-days: 14
