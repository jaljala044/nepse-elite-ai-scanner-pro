name: Portfolio slice A tests

on:
  pull_request:
    paths:
      - "backend/app/portfolio_*.py"
      - "backend/tests/test_portfolio_*.py"
      - "backend/app/main.py"
      - "docs/PORTFOLIO_INTELLIGENCE_SLICE_A.md"
      - ".github/workflows/portfolio-tests.yml"

permissions:
  contents: read

jobs:
  portfolio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run portfolio accounting and API tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_portfolio_service -v
          python -m unittest tests.test_portfolio_routes -v
