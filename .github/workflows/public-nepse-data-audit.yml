name: public-nepse-data-audit

on:
  pull_request:
    paths:
      - "backend/audit_public_nepal_market_data.py"
      - "backend/tests/test_audit_public_nepal_market_data.py"
      - ".github/workflows/public-nepse-data-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-public-secondary-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install "httpx>=0.27,<1"

      - name: Test public archive audit parser
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_audit_public_nepal_market_data.py" -v

      - name: Audit every ordinary listed equity CSV in the public archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python backend/audit_public_nepal_market_data.py \
            --workers 8 \
            --output artifacts/public-nepse-archive-audit.json

      - name: Publish audit summary
        if: always() && hashFiles('artifacts/public-nepse-archive-audit.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/public-nepse-archive-audit.json").read_text())
          summary = {
              "source_commit": report["source_commit"],
              "ordinary_listed_symbols_expected": report["ordinary_listed_symbols_expected"],
              "ordinary_listed_files_audited": report["ordinary_listed_files_audited"],
              "missing_files": report["missing_files"],
              "download_errors": len(report["download_errors"]),
              "date_range": report["date_range"],
              "totals": report["totals"],
              "symbols_with_any_quality_issue": report["symbols_with_any_quality_issue"],
              "official_history_crosscheck": {
                  key: report["official_history_crosscheck"].get(key)
                  for key in ("status", "official_symbols_found", "official_rows",
                              "public_rows_matched_by_date", "fully_matching_rows",
                              "match_rate_pct", "field_comparisons", "field_mismatches",
                              "mismatches_by_field", "field_error_stats", "missing_public_active_rows",
                              "missing_public_zero_activity_rows", "missing_public_symbol_files",
                              "hash_or_parse_errors", "mismatch_examples")
              },
              "socrateai_history_crosscheck": {
                  key: report["socrateai_history_crosscheck"].get(key)
                  for key in ("status", "source_commit", "official_rows",
                              "public_dates_expected", "public_files_found", "missing_public_files",
                              "official_rows_matched_by_date", "fully_matching_rows",
                              "match_rate_pct", "field_comparisons", "field_mismatches",
                              "mismatches_by_field", "missing_public_active_rows",
                              "missing_public_zero_activity_rows", "mismatch_examples",
                              "official_hash_errors", "download_errors", "gate")
              },
              "gate": report["gate"],
              "limitations": report["limitations"],
          }
          rendered = json.dumps(summary, indent=2)
          print(rendered)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("## Public NEPSE archive audit (secondary data only)\n\n")
              stream.write("```json\n" + rendered + "\n```\n")
          PY

      - name: Upload full per-symbol audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-nepse-secondary-archive-audit
          path: artifacts/public-nepse-archive-audit.json
          if-no-files-found: warn
          retention-days: 30
