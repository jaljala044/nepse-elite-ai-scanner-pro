name: hf-dataset-inventory

on:
  push:
    branches: [main]
    paths:
      - "backend/app/hf_dataset_collector.py"
      - "backend/inventory_hf_datasets.py"
      - "backend/acquire_floorsheet_archive.py"
      - "backend/build_calendar_coverage_matrix.py"
      - "backend/build_recent_history_target.py"
      - "backend/tests/test_recent_history_target.py"
      - "data/reference/nepse_session_calendar.csv"
      - "data/reference/nepse_calendar_evidence_leads_2026.csv"
      - ".github/workflows/hf-dataset-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-public-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Inventory public Hugging Face datasets
        run: python inventory_hf_datasets.py --output ../data/reports/hf-dataset-inventory-summary.json
        working-directory: backend
      - name: Enumerate Urekmazino floorsheet archive (manifest only)
        run: >-
          python acquire_hf_floorsheet_archive.py
          --repo-id urekmazino69/Nepse-floorsheet-and-indices
          --path floorsheet
          --revision main
          --output ../artifacts/source-manifests
        working-directory: backend
      - name: Enumerate SocrateAI GitHub floorsheet archive (manifest only)
        run: >-
          python acquire_floorsheet_archive.py
          --owner socrateai-official
          --repo nepse-open-data
          --ref main
          --prefix floorsheet
          --output ../artifacts/source-manifests
        working-directory: backend
      - name: Enumerate SamirWagle GitHub floorsheet archive (manifest only)
        run: >-
          python acquire_floorsheet_archive.py
          --owner SamirWagle
          --repo Nepse-All-Scraper
          --ref main
          --prefix data/floorsheet
          --output ../artifacts/source-manifests
        working-directory: backend
      - name: Build date-level NEPSE calendar and source coverage matrix
        run: |
          mapfile -t manifests < <(find ../artifacts/source-manifests -maxdepth 1 -type f -name '*.jsonl' | sort)
          args=()
          for manifest in "${manifests[@]}"; do args+=(--manifest "$manifest"); done
          python build_calendar_coverage_matrix.py "${args[@]}" --calendar ../data/reference/nepse_session_calendar.csv --start-date 2024-01-02 --end-date 2026-11-24 --output ../artifacts/source-manifests/nepse-calendar-coverage-matrix.json
          python build_recent_history_target.py "${args[@]}" --calendar ../data/reference/nepse_session_calendar.csv --minimum-sessions 90 --target-sessions 120 --output ../artifacts/source-manifests/recent-90-120-session-target.json
        working-directory: backend
      - name: Upload inventory manifest and summary
        uses: actions/upload-artifact@v4
        with:
          name: nepse-hf-data-inventory
          path: |
            data/raw/huggingface/manifests/
            data/reports/hf-dataset-inventory-summary.json
            artifacts/source-manifests/
          if-no-files-found: error
          retention-days: 90
