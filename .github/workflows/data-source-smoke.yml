name: data-source-smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/app/hf_dataset_collector.py"
      - "backend/app/normalize_floorsheet.py"
      - "backend/collect_hf_datasets.py"
      - "backend/normalize_floorsheet_csv.py"
      - "backend/probe_hf_dataset.py"
      - "backend/audit_silver_floorsheet.py"
      - "backend/app/normalize_indices.py"
      - "backend/normalize_indices_csv.py"
      - "backend/audit_silver_indices.py"
      - ".github/workflows/data-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-floorsheet-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Install shared validation package
        run: python -m pip install "git+https://github.com/jaljala044/nepse-smc-data.git@122acaae8665fd396d206ea40b66861b9cbd4d6b"
      - name: Probe Hugging Face dataset tree response
        run: python probe_hf_dataset.py
        working-directory: backend
      - name: Download one known trading session
        run: >
          python collect_hf_datasets.py
          --dataset floorsheet_indices_2024
          --download
          --from-date 2024-01-02
          --to-date 2024-01-02
          --max-total-mb 50
          --max-file-mb 50
          --max-files 5
        working-directory: backend
      - name: Normalize sample floorsheet
        run: >
          python normalize_floorsheet_csv.py
          ../data/raw/huggingface/urekmazino69__Nepse-floorsheet-and-indices/main/floorsheet
          --source urekmazino69/Nepse-floorsheet-and-indices
          --max-reject-ratio 0.10
        working-directory: backend
      - name: Normalize sample sector indices
        run: >
          python normalize_indices_csv.py
          ../data/raw/huggingface/urekmazino69__Nepse-floorsheet-and-indices/main/indices
          --source urekmazino69/Nepse-floorsheet-and-indices
          --max-reject-ratio 0.10
        working-directory: backend
      - name: Audit normalized floorsheet
        run: python audit_silver_floorsheet.py --output ../data/reports/sample-floorsheet-audit.json
        working-directory: backend
      - name: Audit normalized sector indices
        run: python audit_silver_indices.py --output ../data/reports/sample-sector-index-audit.json
        working-directory: backend
      - name: Upload raw sample, normalized rows and audit
        uses: actions/upload-artifact@v4
        with:
          name: nepse-floorsheet-sample-2024-01-02
          path: |
            data/raw/huggingface/
            data/silver/floorsheet/
            data/quarantine/
            data/reports/
          if-no-files-found: error
          retention-days: 14
