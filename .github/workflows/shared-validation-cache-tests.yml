name: Shared validation cache scanner tests
on:
  push:
    paths:
      - "backend/app/normalize_floorsheet.py"
      - "backend/normalize_floorsheet_csv.py"
      - "backend/tests/test_shared_floorsheet_cache.py"
      - "backend/app/historical_coverage.py"
      - "backend/tests/test_historical_coverage.py"
      - ".github/workflows/shared-validation-cache-tests.yml"
  pull_request:
    paths:
      - "backend/app/normalize_floorsheet.py"
      - "backend/normalize_floorsheet_csv.py"
      - "backend/tests/test_shared_floorsheet_cache.py"
      - "backend/app/historical_coverage.py"
      - "backend/tests/test_historical_coverage.py"
      - ".github/workflows/shared-validation-cache-tests.yml"
jobs:
  scanner-cache-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared validation package
        run: python -m pip install "git+https://github.com/jaljala044/nepse-smc-data.git@edbdfcff33afe0b6711639a0a56cbce0d32ea9fb"
      - name: Install scanner backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run shared validation integration tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_shared_*.py' -v && python -m unittest discover -s tests -p test_historical_coverage.py -v
