name: Broker raw-capture regression tests

on:
  pull_request:
    paths:
      - "backend/app/broker_batch_manifest.py"
      - "backend/tests/test_broker_batch_manifest.py"
      - ".github/workflows/broker-capture-regression.yml"
  push:
    branches:
      - "fix/issue-90-capture-conflict-audit"
    paths:
      - "backend/app/broker_batch_manifest.py"
      - "backend/tests/test_broker_batch_manifest.py"
      - ".github/workflows/broker-capture-regression.yml"

permissions:
  contents: read

jobs:
  capture-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run immutable capture registry tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_broker_batch_manifest -v
