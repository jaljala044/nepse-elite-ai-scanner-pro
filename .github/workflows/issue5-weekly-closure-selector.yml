name: Issue 5 weekly closure selector tests
on:
  pull_request:
    paths:
      - "scripts/rank_issue5_weekly_closure_batches.py"
      - "tests/test_issue5_weekly_closure_selector.py"
      - ".github/workflows/issue5-weekly-closure-selector.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused selector tests
        run: python -m unittest discover -s tests -p 'test_issue5_weekly_closure_selector.py' -v
