name: ankit-parquet-inspection

on:
  push:
    branches: [main]
    paths:
      - "backend/app/parquet_inspector.py"
      - "backend/inspect_parquet_datasets.py"
      - ".github/workflows/ankit-parquet-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-parquet-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Download bounded public Parquet archive
        run: >
          python collect_hf_datasets.py
          --dataset market_data_2026
          --download
          --max-total-mb 40
          --max-file-mb 15
          --max-files 400
        working-directory: backend
      - name: Inspect table schemas and rows
        run: >
          python inspect_parquet_datasets.py
          --input ../data/raw/huggingface/AnkitSanjyal__nepse-market-data/main
          --output ../data/reports/ankit-parquet-inspection.json
        working-directory: backend
      - name: Upload raw Parquet sample and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ankit-nepse-parquet-inspection
          path: |
            data/raw/huggingface/
            data/reports/ankit-parquet-inspection.json
          if-no-files-found: error
          retention-days: 14
