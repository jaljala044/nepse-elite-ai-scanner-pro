name: NEPSE historical data integrity

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/hf_dataset_collector.py"
      - "backend/app/coverage_matrix.py"
      - "backend/run_hf_inventory.py"
      - "backend/tests/**"
      - ".github/workflows/nepse-data-integrity.yml"

permissions:
  contents: read

jobs:
  tests-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependency
        run: python -m pip install --upgrade pip httpx
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest tests.test_hf_dataset_collector tests.test_coverage_matrix -v
      - name: Generate pinned Hugging Face inventory
        working-directory: backend
        run: python run_hf_inventory.py --max-files 10000
      - name: Upload inventory manifest
        uses: actions/upload-artifact@v4
        with:
          name: nepse-hf-inventory
          path: data/raw/huggingface/manifests/*.json
          if-no-files-found: error
          retention-days: 30
