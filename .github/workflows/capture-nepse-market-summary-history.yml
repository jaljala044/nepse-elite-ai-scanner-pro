name: Capture official NEPSE market-summary history

on:
  push:
    branches: [main]
    paths:
      - "backend/capture_nepse_market_summary_history.py"
      - "backend/import_official_market_summary_to_bronze.py"
      - "backend/tests/test_nepse_market_summary_history_capture.py"
      - "backend/tests/test_official_market_summary_bronze_import.py"
      - ".github/workflows/capture-nepse-market-summary-history.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nepse-market-summary-history
  cancel-in-progress: false

jobs:
  capture-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned capture client and backend dependencies
        run: |
          python -m pip install --disable-pip-version-check "nepse-client==0.1.4"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Test capture and bronze importer
        working-directory: backend
        run: |
          python -m unittest discover -s tests -p 'test_nepse_market_summary_history_capture.py' -v
          python -m unittest discover -s tests -p 'test_official_market_summary_bronze_import.py' -v
      - name: Capture official market-summary-history response
        id: capture
        shell: bash
        run: |
          set +e
          capture_date="$(TZ=Asia/Kathmandu date +%Y-%m-%d)"
          python backend/capture_nepse_market_summary_history.py --output-dir "evidence/nepse-market-summary-history/$capture_date" --candidate-csv data/evidence/candidates/nepse-616-session-date-candidates-2024-2026.csv
          status=$?
          echo "capture_date=$capture_date" >> "$GITHUB_OUTPUT"
          echo "capture_exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Commit captured raw response when HTTP 200
        if: steps.capture.outputs.capture_exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          capture_date="${{ steps.capture.outputs.capture_date }}"
          target="data/evidence/raw/nepse/market-summary-history/$capture_date"
          mkdir -p "$target"
          cp "evidence/nepse-market-summary-history/$capture_date/"* "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "data: archive official NEPSE market-summary history"
            git pull --rebase origin main
            git push
          else
            echo "No new official market-summary history bytes to commit."
          fi
      - name: Import exact capture into provisional bronze evidence
        if: steps.capture.outputs.capture_exit_code == '0'
        run: |
          capture_date="${{ steps.capture.outputs.capture_date }}"
          python backend/import_official_market_summary_to_bronze.py \
            --capture-dir "evidence/nepse-market-summary-history/$capture_date" \
            --storage-root "evidence-store/raw" \
            --database "evidence-store/evidence.duckdb"
      - name: Upload capture and bronze evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-market-summary-evidence-${{ github.run_id }}
          path: |
            evidence/nepse-market-summary-history/
            evidence-store/
          if-no-files-found: warn
          retention-days: 90
