# Re-run trigger after project-accepted 3,630-date calendar baseline was applied.
name: Repeated adjacent OHLCV candidate audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/publish_issue5_review_ledger.py"
      - "scripts/extract_repeated_adjacent_ohlcv.py"
      - "scripts/validate_repeated_adjacent_ohlcv.py"
      - ".github/workflows/repeated-adjacent-ohlcv-audit.yml"
  push:
    paths:
      - "scripts/extract_repeated_adjacent_ohlcv.py"
      - "scripts/validate_repeated_adjacent_ohlcv.py"
      - "tests/test_validate_repeated_adjacent_ohlcv.py"
      - "tests/test_repeated_adjacent_ohlcv.py"
      - ".github/workflows/repeated-adjacent-ohlcv-audit.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit code
        uses: actions/checkout@v4
      - name: Checkout pinned NEPSE SMC archive
        uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-smc-data
          ref: 937cfcf93d78dfcf28a9f09bb13291447988157b
          path: sources/nepse-smc-data
      - name: Checkout pinned history starter archive
        uses: actions/checkout@v4
        with:
          repository: jaljala044/nepse-history-starter
          ref: b60728d39f34e0f9e428675d817fd52ed2784da6
          path: sources/nepse-history-starter
      - name: Run extractor unit tests
        run: python -m unittest discover -s tests -p 'test_repeated_adjacent_ohlcv.py'
      - name: Run candidate-ledger validator unit tests
        run: python -m unittest discover -s tests -p 'test_validate_repeated_adjacent_ohlcv.py' -v
      - name: Extract repeated adjacent-row candidates
        run: |
          python scripts/extract_repeated_adjacent_ohlcv.py \
            --source jaljala044/nepse-smc-data 937cfcf93d78dfcf28a9f09bb13291447988157b sources/nepse-smc-data/03_stock_charts_ohlcv \
            --source jaljala044/nepse-history-starter b60728d39f34e0f9e428675d817fd52ed2784da6 sources/nepse-history-starter/03_stock_charts_ohlcv \
            --out reports/repeated-adjacent-ohlcv \
            --calendar data/reference/nepse_session_calendar.csv
      - name: Validate extracted candidate ledger
        run: |
          set +e
          python scripts/validate_repeated_adjacent_ohlcv.py \
            --input reports/repeated-adjacent-ohlcv/repeated_adjacent_ohlcv_candidates.csv \
            --output reports/repeated-adjacent-ohlcv/candidate-ledger-integrity.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "Candidate-ledger validator failed unexpectedly: $status"
            exit "$status"
          fi
      - name: Build deterministic Issue #5 review ledger
        run: |
          python scripts/publish_issue5_review_ledger.py \
            --input reports/repeated-adjacent-ohlcv/repeated_adjacent_ohlcv_candidates.csv \
            --output reports/repeated-adjacent-ohlcv/issue5_candidate_row_review.csv \
            --manifest reports/repeated-adjacent-ohlcv/issue5_review_ledger_manifest.json
      - name: Upload pinned review evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue5-candidate-row-review
          path: |
            reports/repeated-adjacent-ohlcv/issue5_candidate_row_review.csv
            reports/repeated-adjacent-ohlcv/issue5_review_ledger_manifest.json
          if-no-files-found: error
          retention-days: 90
